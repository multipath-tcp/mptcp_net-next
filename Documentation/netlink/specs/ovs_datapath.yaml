---
name: ovs_datapath
version: 2
protocol: genetlink-legacy
uapi-header: linux/openvswitch.h

doc: >-
  OVS datapath configuration over generic netlink.

definitions:
  -
    name: ovs-header
    type: struct
    doc: |
      Header for OVS Generic Netlink messages.
    members:
      -
        name: dp-ifindex
        type: u32
  -
    name: user-features
    type: flags
    name-prefix: ovs-dp-f-
    enum-name:
    entries:
      -
        name: unaligned
        doc: Allow last Netlink attribute to be unaligned
      -
        name: vport-pids
        doc: Allow datapath to associate multiple Netlink PIDs to each vport
      -
        name: tc-recirc-sharing
        doc: Allow tc offload recirc sharing
      -
        name: dispatch-upcall-per-cpu
        doc: Allow per-cpu dispatch of upcalls
  -
    name: ovs-dp-stats
    type: struct
    members:
      -
        name: n-hit
        type: u64
      -
        name: n-missed
        type: u64
      -
        name: n-lost
        type: u64
      -
        name: n-flows
        type: u64
  -
    name: ovs-dp-megaflow-stats
    type: struct
    members:
      -
        name: n-mask-hit
        type: u64
      -
        name: n-masks
        type: u32
      -
        name: padding
        type: u32
      -
        name: n-cache-hit
        type: u64
      -
        name: pad1
        type: u64

attribute-sets:
  -
    name: datapath
    name-prefix: ovs-dp-attr-
    enum-name: ovs-datapath-attrs
    attributes:
      -
        name: name
        type: string
      -
        name: upcall-pid
        doc: upcall pid
        type: u32
      -
        name: stats
        type: binary
        struct: ovs-dp-stats
      -
        name: megaflow-stats
        type: binary
        struct: ovs-dp-megaflow-stats
      -
        name: user-features
        type: u32
        enum: user-features
        enum-as-flags: true
      -
        name: pad
        type: unused
      -
        name: masks-cache-size
        type: u32
      -
        name: per-cpu-pids
        type: binary
        sub-type: u32
      -
        name: ifindex
        type: s32
        checks:
          min: 0

operations:
  fixed-header: ovs-header
  name-prefix: ovs-dp-cmd-
  list:
    -
      name: get
      doc: |
        Get one OVS data path by name, or by the ifindex in the header when
        the request carries no name.
      value: 3
      attribute-set: datapath
      dont-validate: [strict, dump]
      do:
        request:
          attributes:
            - name
        reply: &dp-reply
          attributes:
            - name
            - stats
            - megaflow-stats
            - user-features
            - masks-cache-size
            - per-cpu-pids
      dump:
        request:
          attributes: []
        reply: *dp-reply
    -
      name: new
      doc: |
        Create new OVS data path. per-cpu-pids takes effect only when the
        same request sets OVS_DP_F_DISPATCH_UPCALL_PER_CPU in user-features.
      value: 1
      attribute-set: datapath
      dont-validate: [strict, dump]
      flags: [uns-admin-perm]
      do:
        request:
          attributes:
            - name
            - upcall-pid
            - user-features
            - masks-cache-size
            - per-cpu-pids
            - ifindex
    -
      name: del
      doc: Delete existing OVS data path
      value: 2
      attribute-set: datapath
      dont-validate: [strict, dump]
      flags: [uns-admin-perm]
      do:
        request:
          attributes:
            - name
    -
      name: set
      doc: |
        Modify an existing OVS data path. The kernel treats a missing
        user-features attribute as zero and clears the previously set
        features. per-cpu-pids takes effect only when the same request
        sets OVS_DP_F_DISPATCH_UPCALL_PER_CPU in user-features. A
        successful set also sends the updated data path to the
        family's multicast group, and to the requester when the
        request sets NLM_F_ECHO.
      value: 4
      attribute-set: datapath
      dont-validate: [strict, dump]
      flags: [uns-admin-perm]
      do:
        request:
          attributes:
            - name
            - user-features
            - masks-cache-size
            - per-cpu-pids

mcast-groups:
  list:
    -
      name: ovs_datapath
